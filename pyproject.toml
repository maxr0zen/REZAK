[project]
name = "rezak"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "opencv-python-headless==4.11.0.86",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic==2.13.4",
    "python-multipart>=0.0.20,<1",
    "streamlink==8.6.2",
    "uvicorn>=0.34,<1",
]
[dependency-groups]
dev = ["pytest==9.0.2", "imageio-ffmpeg==0.6.0", "pillow==12.1.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--basetemp=.tools/pytest-tmp"
